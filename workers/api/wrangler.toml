name = "ncm-api"
main = "src/index.js"
compatibility_date = "2026-08-04"
compatibility_flags = ["enable_nodejs_child_process_module"]

# Node.js 兼容说明：
# - compatibility_date = "2026-08-04" 默认开启 nodejs_compat + nodejs_compat_v2
# - enable_nodejs_child_process_module: 提供 child_process 存根（避免 import 报错）

# 环境变量
[vars]
NODE_ENV = "production"
ENABLE_FLAC = "true"
ENABLE_GENERAL_UNBLOCK = "true"
CORS_ALLOW_ORIGIN = "*"
# 禁用版本检查（child_process 在 Workers 中不可用）
CHECK_VERSION = "false"
# 禁用文件上传（Workers 不支持临时文件）
ENABLE_FILE_UPLOAD = "false"

# 生产环境
[env.production]
name = "ncm-api"

# 也可以绑定 KV 用于缓存（可选）
# [[kv_namespaces]]
# binding = "NCM_CACHE"
# id = "your-kv-namespace-id"
