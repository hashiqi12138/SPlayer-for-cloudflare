name = "ncm-api"
main = "src/index.js"
compatibility_date = "2026-08-04"
compatibility_flags = ["enable_nodejs_child_process_module"]

# Node.js 兼容说明：
# - compatibility_date = "2026-08-04" 默认开启 nodejs_compat + nodejs_compat_v2
# - enable_nodejs_child_process_module: 提供 child_process 存根（避免 import 报错）

# 环境变量
[vars]
NODE_ENV = "production"
ENABLE_FLAC = "true"
ENABLE_GENERAL_UNBLOCK = "true"
CORS_ALLOW_ORIGIN = "*"
# 禁用版本检查（child_process 在 Workers 中不可用）
CHECK_VERSION = "false"
# 禁用文件上传（Workers 不支持临时文件）
ENABLE_FILE_UPLOAD = "false"

# 解锁（解灰）总开关
#
# 实测结论（Cloudflare 出口，2026-11）：
#   - netease（GD 音乐台聚合接口）：可用，抽样 11/12 命中，直链音频体积正常
#   - kuwo：不可用，convert_url2 返回空响应
#   - bodian：不可用，恒定回 20018「没有解锁付费歌曲」
# 因此只开 netease 一个音源，另外两个保持关闭：开了也只会让前端白等一次请求，
# 还会拖慢不可用歌曲的播放。
ENABLE_UNBLOCK = "true"

# 启用的音源（逗号分隔）。代码里按此过滤，未列出的源即使被请求也直接回 404。
ENABLE_UNBLOCK_SOURCES = "netease"

# 生产环境
[env.production]
name = "ncm-api"

# 也可以绑定 KV 用于缓存（可选）
# [[kv_namespaces]]
# binding = "NCM_CACHE"
# id = "your-kv-namespace-id"
