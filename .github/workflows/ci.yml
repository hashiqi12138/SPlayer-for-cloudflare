name: CI

# 设计说明
# --------
# 这个 workflow **不在里面写具体检查内容**，只调用 `npm run verify`。
# 检查逻辑全部收敛在 scripts/verify.mjs，好处是：
#   1. 本地 `npm run verify` 跑的就是 CI 跑的东西，两边不会漂移
#   2. Windows 上想复现 CI 不必读 YAML，直接跑命令即可
#   3. 加检查项不需要动 CI 配置
#
# 两个平台都跑：这个项目历史上反复被 Windows 特有问题咬过
# （PowerShell 脚本缺 BOM 导致解析失败、CRLF 让 bash 报 $'\r'、
# MSYS2/Git Bash 把 /api/netease 改写成 E:/.../api/netease），
# 只在 Linux 上验证等于放弃了这些防线。

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消尚未跑完的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 自检 + 可复现构建（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码（含 submodule 固定版本）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖（严格按锁文件）
        # 用 ci 而不是 install：锁文件与 package.json 不一致时直接失败，
        # 顺便把「工具链版本可复现」这条线守住。
        run: npm ci

      - name: 安装 Worker 依赖
        # workers/api 有自己的一套依赖（crypto-js 等），单元测试要用到
        run: npm run setup:worker-deps

      - name: 按固定版本检出上游依赖并应用补丁
        run: npm run deps:setup

      - name: 仓库自检 + 生成物可复现
        # verify:full 比 verify 多一项：重建 generated-routes.js 并与入库版本比对，
        # 相当于验证「补丁确实应用了」且「重建结果可复现」。
        #
        # 注意这里用独立的 npm script 而不是 `npm run verify -- --with-build`：
        # npm 10 不会把 `--` 之后的参数转发给脚本，那样会静默降级成不带重建的检查。
        run: npm run verify:full

      - name: 依赖状态
        run: npm run deps:status

  verify-windows:
    name: 自检（Windows）
    # 只跑自检、不跑重建比对：Windows 侧要守住的是 BOM / 换行符 /
    # 路径转换这些平台特有问题，生成物可复现性在 Linux 上验证一次即可。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码（含 submodule 固定版本）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖（严格按锁文件）
        run: npm ci

      - name: 安装 Worker 依赖
        run: npm run setup:worker-deps

      - name: 按固定版本检出上游依赖并应用补丁
        run: npm run deps:setup

      - name: 仓库自检
        # windows-latest 自带 Git Bash，部署脚本自检（含 MSYS 路径转换用例）会一并执行
        run: npm run verify

  integration-smoke:
    name: 线上接口冒烟（手动触发）
    # 打已部署的 Worker，校验 0 失败用例。
    # 「受限」类（网易云 -462、解锁音源地区限制）不计入失败。
    # 之所以不放进常规门禁：它依赖外网与真实登录态，结果不稳定。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Worker 依赖
        run: npm run setup:worker-deps

      - name: 运行接口测试
        # 需要登录态的用例在未提供 NCM_COOKIE 时自动跳过
        env:
          NCM_COOKIE: ${{ secrets.NCM_COOKIE }}
        run: npm run test:api
