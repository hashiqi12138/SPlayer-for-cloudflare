name: Deploy

# 说明
# ----
# 只在手动触发时运行，且需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。
# 未配置时会**直接失败**，不会误操作线上。
#
# 为什么不在 push 时自动部署：
# 部署会立即影响线上用户，而本项目又依赖两个上游 submodule 与本地补丁，
# 「测试全绿」与「适合发布」之间还需要一次人工判断（上游行为是否变化、
# 是否要顺带调整版本号）。把发布收敛成一个显式动作，比自动上线更适合这里的节奏。
#
# 建议在仓库 Settings → Environments 里给这个 workflow 绑定审批环境，
# 这样发布需要额外点一次确认。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 部署目标
        type: choice
        required: true
        default: pages
        options:
          - pages
          - api
          - proxy
          - all
      ref:
        description: 要部署的 ref（分支 / tag，留空表示当前分支）
        type: string
        required: false
        default: ''

# 同一时间只允许一个部署在跑，避免两个发布交叉写入
concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署 ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: 校验部署凭据
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code=0
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::未配置 CLOUDFLARE_API_TOKEN，无法部署。请在仓库 Settings → Secrets 中添加。"
            code=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::未配置 CLOUDFLARE_ACCOUNT_ID，无法部署。"
            code=1
          fi
          exit $code

      - name: 检出代码（含 submodule 固定版本）
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖（严格按锁文件）
        run: npm ci

      - name: 安装 Worker 依赖
        run: npm run setup:worker-deps

      - name: 按固定版本检出上游依赖并应用补丁
        run: npm run deps:setup

      - name: 部署前全量自检
        # 与 CI 完全同一条命令：这里是发布闸门的最后一关。
        # 本地/CI 没跑过的检查，不允许靠人工绕过直接上线。
        run: npm run verify:full

      - name: 依赖状态
        run: npm run deps:status

      - name: 部署前端 Pages
        if: inputs.target == 'pages' || inputs.target == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 用环境变量而不是 `npm run deploy:pages -- --non-interactive`：
          # npm 10 不会转发 `--` 之后的参数。
          NON_INTERACTIVE: '1'
        run: npm run deploy:pages

      - name: 部署 API Worker
        if: inputs.target == 'api' || inputs.target == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NON_INTERACTIVE: '1'
        run: npm run deploy:api

      - name: 部署音频代理 Worker
        if: inputs.target == 'proxy' || inputs.target == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NON_INTERACTIVE: '1'
        run: npm run deploy:proxy

      - name: 汇总
        run: |
          echo "部署目标: ${{ github.event.inputs.target }}"
          echo "提交: $(git rev-parse --short=7 HEAD)"
          echo "版本戳会随前端产物发布，部署完成后可访问 /version.json 核对"
          {
            echo "## 部署完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 目标 | \`${{ github.event.inputs.target }}\` |"
            echo "| 提交 | \`$(git rev-parse --short=7 HEAD)\` |"
            echo "| 触发者 | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
